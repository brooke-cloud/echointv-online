# .github/workflows/daily-job-sync.yml

name: Daily Big Tech Job Sync

on:
  schedule:
    # 每天 UTC 00:00 (北京时间早 8:00) 自动触发一次抓取
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持在 GitHub 网页手动点击触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run Job Crawler Script
        run: node scripts/crawl-jobs.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}